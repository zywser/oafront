# 反向代理：uWSGI socket（与后端容器通过共享卷 /data/sock 互通）
upstream oa {
    server unix:///data/sock/oa.sock;
}

server {
    listen 80;
    server_name www.zywser.me 121.41.67.132 127.0.0.1;
    charset utf-8;
    # 知识文件上传（pdf/md），默认 1M 不够
    client_max_body_size 20m;

    root /www/dist;
    index index.html;

    # Vue Router history 模式：前端路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django API（uwsgi 协议）
    location /api {
        include /etc/nginx/uwsgi_params;
        uwsgi_pass oa;
        uwsgi_param HTTP_HOST $host;          # Django ALLOWED_HOSTS 依赖 HTTP_HOST
        # SSE 流式回答：关闭缓冲 + 加长超时，否则逐字流被吞、45s 被掐断
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
    }

    # Django 静态文件（collectstatic 产物，共享卷挂到 /www/staticfiles）
    location /static {
        alias /www/staticfiles;
    }

    # 用户上传文件（共享卷挂到 /www/media）
    location /media {
        alias /www/media;
    }

    access_log /data/log/access.log;
    error_log /data/log/error.log;
}
